server:
  adminMinThreads: 1
  adminMaxThreads: 64
  applicationConnectors:
    - type: http
      port: 8088
  adminConnectors:
    - type: http
      port: 8087
defaultSize: 5
mcp:
  enabled: true
  name: langchain-mcp-server
  version: 1.0.0
  instructions: Use the tools registered from the service package to answer requests.
swagger:
  resourcePackage: com.langchain.central.resource
logging:
  level: INFO
  loggers:
    com.langchain: INFO
    org.hibernate: DEBUG
  appenders:
    - type: console
      threshold: INFO
      timeZone: IST
      logFormat: "%(%-5level) %X{X-TRACE-ID}  %X{span_id} [%date] [%thread] [%logger{0}]: %message%n"